<style>
    .form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    box-sizing: border-box;
}

/* Fix specifically for date input */
.form-group input[type="date"] {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: textfield;
    height: 40px; /* match other inputs */
}

/* Optional: align calendar icon */
.form-group input[type="date"]::-webkit-calendar-picker-indicator {
    cursor: pointer;
    opacity: 0.7;
}
</style>

<!-- =========================
STUDENT SECTION
========================= -->

<div class="section-title">
    <h2>Student Control</h2>
    <p>Manage Student Records & Enrollment</p>
</div>

<!-- =========================
ADD STUDENT FORM
========================= -->

<form id="studentForm" class="dashboard-form" enctype="multipart/form-data">

    <div class="form-grid">

        <div class="form-group">
            <label for="studentName">Full Name</label>
            <input type="text" id="studentName" required>
        </div>

        <div class="form-group">
            <label for="studentBatch">Batch</label>
            <select id="studentBatch" required>
                <option value="">Select Batch</option>
            </select>
        </div>

        <div class="form-group">
            <label for="studentRoll">Roll Number</label>
            <input type="text" id="studentRoll" required>
        </div>

        <div class="form-group">
            <label for="studentEmail">Email Address</label>
            <input type="email" id="studentEmail" required>
        </div>

        <div class="form-group">
            <label for="studentPhone">Phone Number</label>
            <input type="text" id="studentPhone" required>
        </div>

        <div class="form-group">
            <label for="studentYear">Year / Semester</label>
            <input type="text" id="studentYear" required>
        </div>

        <div class="form-group">
            <label for="studentDOB">Date of Birth</label>
            <input type="date" id="studentDOB" required>
        </div>

        <div class="form-group">
            <label for="studentStatus">Status</label>
            <select id="studentStatus">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>

        <div class="form-group">
            <label for="studentImage">Student Image</label>
            <input type="file" id="studentImage" accept="image/*">
        </div>

    </div>

    <div class="form-group">
        <label for="studentAddress">Address</label>
        <textarea id="studentAddress" rows="4"></textarea>
    </div>

    <button type="submit" class="action-btn">
        <i class="fa-solid fa-plus"></i>
        Add Student
    </button>

</form>
<!-- =========================
SEARCH + FILTER BAR (PRO UPGRADE)
========================= -->

<div class="search-box-wrapper">

    <div style="flex-grow:1;">
        <input type="text" id="studentSearch" placeholder="Search Students (name / roll / batch)">
    </div>

    <button type="button"
            class="search-btn"
            onclick="if(typeof searchStudent==='function') searchStudent()">
        <i class="fa-solid fa-magnifying-glass"></i>
        Search
    </button>

</div>

<!-- =========================
PRO ACTION BUTTONS
========================= -->

<div style="margin:10px 0; display:flex; gap:10px; flex-wrap:wrap;">

    <button type="button" onclick="loadStudentPro()">
        Load Students (Pro)
    </button>

    <button type="button" onclick="exportStudentsExcel()">
        Export Students Excel
    </button>

</div>

<!-- =========================
STUDENT LIST
========================= -->

<div id="studentList" class="student-list">
    Loading...
</div>

<!-- =========================
OPTIONAL: STUDENT PROFILE MODAL (READY FOR FUTURE USE)
========================= -->

<div id="studentModal"
     style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
     background:rgba(0,0,0,0.6); justify-content:center; align-items:center;">

    <div style="background:white; padding:20px; width:300px; border-radius:10px;">

        <h3>Student Profile</h3>

        <div id="modalContent"></div>

        <button onclick="document.getElementById('studentModal').style.display='none'">
            Close
        </button>

    </div>

</div>
