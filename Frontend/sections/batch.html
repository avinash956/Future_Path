<!-- =========================
        CSS FOR BATCH SECTION
========================= -->
<style>
/* =========== CSS for card of the batches in Batch Section ================== */
.faculty-card {
    background:linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(4, 31, 94, 0.95));
    color:rgb(237, 191, 6);
    border-radius: 14px;
    padding: 16px;
    margin: 10px 0;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    transition: 0.2s;
}

.faculty-card:hover {
    transform: translateY(-3px);
}

.faculty-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.faculty-header h3 {
    margin: 0;
    font-size: 16px;
    color: #f3e304;
}

/* =========================================
MODERN TOGGLE SWITCH
========================================= */

.faculty-switch {
    position: relative;
    display: inline-block;
    width: 52px;
    height: 28px;
    flex-shrink: 0;
}

.faculty-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    inset: 0;

    background: #e53935; /* OFF = Red */
    border-radius: 50px;

    transition: all 0.3s ease;

    box-shadow:
        inset 0 2px 4px rgba(0,0,0,0.25),
        0 2px 8px rgba(0,0,0,0.15);
}

.slider:before {
    content: "";

    position: absolute;

    width: 22px;
    height: 22px;

    left: 3px;
    top: 3px;

    background: #ffffff;

    border-radius: 50%;

    transition: all 0.3s ease;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.25);
}

/* =========================================
ON STATE
========================================= */

.faculty-switch input:checked + .slider {
    background: #2e7d32; /* Green */
}

.faculty-switch input:checked + .slider:before {
    transform: translateX(24px);
}

/* =========================================
HOVER EFFECT
========================================= */

.faculty-switch:hover .slider {
    filter: brightness(1.05);
}


.faculty-actions .deactivate-btn {
    background: #ff9800 !important;
    color: white !important;
    border: none;
}

.faculty-actions .download-btn {
    background: #1565c0 !important;
    color: white !important;
    border: none;
}

.faculty-actions .student-list-btn {
    background: #7b1fa2 !important;
    color: white !important;
    border: none;
}

/* shared styling */
.faculty-actions button {
    padding: 8px 14px;
    margin: 4px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.2s;
}

.faculty-actions button:hover {
    transform: translateY(-2px);
    opacity: 0.9;
}
.student-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.student-modal-content{
    width:90%;
    max-width:1000px;
    max-height:80vh;
    overflow:auto;
    background:linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(4, 31, 94, 0.95));
    border-radius:12px;
    padding:20px;
}

.student-modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.student-table{
    width:100%;
    border-collapse:collapse;
}

.student-table th,
.student-table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

.student-table th{
    background:#042265;
    color:white;
}
#studentListContainer {
    background: white;
    color: black;
    padding: 10px;
    min-height: 100px;
}

.student-table {
    background: white;
    color: black;
    width: 100%;
}
</style>
<!-- =========================
BATCH SECTION
========================= -->

<div class="section-title">
    <h2>Batch Control</h2>
    
</div>

<!-- =========================
ADD BATCH FORM
========================= -->

<form id="batchForm" class="dashboard-form">

    <div class="form-grid">

        <input type="text" id="batchName" placeholder="Batch Name (e.g. CSE-2026)" required>

        <!-- AUTO GENERATED BATCH CODE -->
        <input 
            type="text" 
            id="batchCode" 
            placeholder="Batch Code (Auto Generated)" 
            readonly
        >

        <select id="batchDepartment" required>

    <option value="">Select Department</option>

    <option value="Academic">Academic</option>

    <option value="Competitive">Competitive</option>

    <option value="Technical">Technical</option>

</select>

        <input type="number" id="batchStrength" placeholder="Total Students">

        <input type="text" id="batchCoordinator" placeholder="Batch Coordinator">

        <input type="date" id="batchStartDate" required>

        <input type="date" id="batchEndDate" required>

        <select id="batchStatus">
            <option value="active">Active</option>
            <option value="completed">Completed</option>
            <option value="upcoming">Upcoming</option>
        </select>

    </div>

    <textarea id="batchDescription" placeholder="Batch Description / Notes" rows="4"></textarea>

    <button type="submit" class="action-btn">
        <i class="fa-solid fa-plus"></i>
        Add Batch
    </button>

</form>

<!-- =========================
SEARCH BAR
========================= -->

<div class="search-box-wrapper" style="display:flex;gap:10px;background:rgba(255,255,255,0.95);padding:15px;border-radius:12px;margin-bottom:25px;box-shadow:0 8px 24px rgba(0,0,0,0.15);">

    <div style="flex-grow:1;">
        <input type="text" id="batchSearch" placeholder="Search Batches..." style="width:100%;padding:12px 16px;border:1px solid #e0e0e0;border-radius:8px;">
    </div>

    <button type="button" class="search-btn" onclick="searchBatch()"
        style="background:linear-gradient(135deg,#a746e7,#042265);color:white;border:none;padding:0 25px;border-radius:8px;cursor:pointer;">
        <i class="fa-solid fa-magnifying-glass"></i> Search
    </button>

</div>

<!-- =========================
BATCH LIST
========================= -->

<div id="batchList" class="batch-list">Loading...</div>
<!-- STUDENT LIST MODAL -->

<div id="studentModal" class="student-modal">

    <div class="student-modal-content">

        <div class="student-modal-header">
            <h3 id="studentModalTitle">Batch Students</h3>

            <button onclick="closeStudentModal()">
                ✖
            </button>
        </div>

        <div id="studentListContainer">

        </div>

    </div>

</div>
<!-- ================Batch Faculty assign================= -->

<div id="facultyModal" style="display:none;">
    
    <div class="modal-content">

        <h3>Batch Faculties</h3>

<!-- =========THIS IS REQUIRED========================= -->

        <div id="facultyList"></div>

<div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;

">

            font-size:15px;
            cursor:pointer;
            box-shadow:0 4px 12px rgba(0,200,83,.35);
        "

</div>
</div>

</div>
