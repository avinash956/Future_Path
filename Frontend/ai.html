<script>

/* =========================
MENU TOGGLE
========================= */

function toggleMenu(){

document
.getElementById(
"dropdownMenu"
)
.classList.toggle(
"active"
);

}

/* =========================
CLOSE DROPDOWN
========================= */

document.addEventListener(
"click",
function(e){

const menu =
document.getElementById(
"dropdownMenu"
);

const btn =
document.querySelector(
".menu-toggle"
);

if(
menu &&
btn &&
!menu.contains(e.target) &&
!btn.contains(e.target)
){

menu.classList.remove(
"active"
);

}

});

/* =========================
LOGOUT
========================= */

function logout(){

localStorage.clear();

window.location.href =
"login.html";

}

/* =========================
SAVE HISTORY
========================= */

function saveHistory(text){

if(!text.trim()) return;

let history =
JSON.parse(
localStorage.getItem(
"aiHistory"
)
) || [];

/* REMOVE DUPLICATES */
if(!history.includes(text)){

history.unshift(text);

localStorage.setItem(
"aiHistory",
JSON.stringify(history)
);

loadChatHistory();

}

}

/* =========================
LOAD HISTORY
========================= */

function loadChatHistory(){

let history =
JSON.parse(
localStorage.getItem(
"aiHistory"
)
) || [];

const list =
document.getElementById(
"historyList"
);

list.innerHTML = "";

history.forEach(item => {

const div =
document.createElement(
"div"
);

div.className =
"history-item";

div.innerText =
item;

div.title =
item;

div.style.cursor =
"pointer";

div.style.padding =
"10px";

div.style.marginBottom =
"8px";

div.style.background =
"#1e2d40";

div.style.color =
"#fff";

div.style.borderRadius =
"8px";

div.onclick = () => {

const input =
document.getElementById(
"query"
);

input.value =
item;

input.focus();

};

list.appendChild(div);

});

}

/* =========================
CLEAR HISTORY
========================= */

function clearHistory(){

if(
confirm(
"Clear complete AI history?"
)
){

localStorage.removeItem(
"aiHistory"
);

loadChatHistory();

}

}

/* =========================
DOWNLOAD PDF
========================= */

function downloadPDF(){

const { jsPDF } =
window.jspdf;

const doc =
new jsPDF();

const chatBox =
document.getElementById(
"chatBox"
);

let textArray = [];

chatBox
.querySelectorAll('.msg')
.forEach(msg => {

const prefix =
msg.classList.contains(
'user'
)
? 'User: '
: 'AI: ';

textArray.push(
prefix + msg.innerText
);

});

const fullText =
textArray.join("\n\n");

const splitText =
doc.splitTextToSize(
fullText,
180
);

doc.text(
splitText,
10,
10
);

doc.save(
"AI_Chat.pdf"
);

}

</script>

</body>
