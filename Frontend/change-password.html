<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


</head>

<body>

<!-- ================= HEADER ================= -->
<header>

<nav class="navbar">

<!-- LOGO -->
<div class="logo-container">

<img src="Logo.png"
alt="Logo"
class="logo">

<div class="logo-text">

<h2>
Future Path EduTech Institute
</h2>

<p>
<i>Shaping Future With Smart Learning.....</i>
</p>

</div>

</div>

<button class="back-btn" onclick="history.back()">
      <i class="fa-solid fa-arrow-left"></i> Back
    </button>
</nav>

</header>

<!-- ================= CHANGE PASSWORD SECTION ================= -->
<section class="dashboard-section" style="background:linear-gradient(135deg,#2563eb,#7c3aed);">

<div class="section-title">

<h2 style="color: rgb(10, 10, 10);">Change Password</h2>

<p>Set your new secure password</p>

</div>

<form class="profile-form advanced-profile-form" id="changePasswordForm">

<!-- OLD PASSWORD -->
<div class="input-group password-box">

<i class="fa-solid fa-lock"></i>

<input type="password" id="currentPassword" placeholder="Enter current Password" required>

<span class="toggle-password" onclick="toggleCurrentPassword()">
<i class="fa-solid fa-eye"></i>
</span>

</div>

<!-- NEW PASSWORD -->
<div class="input-group password-box">

<i class="fa-solid fa-key"></i>

<input type="password" id="newPassword" placeholder="Enter New Password" required>

<span class="toggle-password" onclick="toggleNewPassword()">

<i class="fa-solid fa-eye"></i>

</span>

</div>

<!-- CONFIRM PASSWORD -->
<div class="input-group password-box">

<i class="fa-solid fa-shield-halved"></i>

<input type="password" id="confirmPassword" placeholder="Confirm New Password" required>

<span class="toggle-password" onclick="toggleConfirmPassword()">

<i class="fa-solid fa-eye"></i>

</span>

</div>

<!-- UPDATE BUTTON -->
<button type="submit"class="login-submit-btn">
 
<i class="fa-solid fa-rotate"></i>
Update Password

</button>

<p id="responseMessage"></p>

</form>

</section>

</body>
</html>
