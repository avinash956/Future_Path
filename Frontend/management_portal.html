<body onload="loadManagementDashboard()">

<!-- ================= PRELOADER ================= -->
<div id="preloader">
  <div class="loader"></div>
</div>

<!-- ================= HEADER ================= -->
<header>

<nav class="navbar">

<div class="logo-container">

<img src="Logo.png" class="logo">

<div class="logo-text">
<h2>Management Panel</h2>
<p><i>Institute Management System</i></p>
</div>

</div>

<!-- LIVE CLOCK -->
<div class="live-clock" id="liveClock"></div>

<!-- HAMBURGER -->
<div class="menu-toggle" onclick="toggleMenu()">
<i class="fa-solid fa-bars"></i>
</div>

<!-- DROPDOWN -->
<div id="dropdownMenu" class="dropdown-menu">

<div class="menu-group">

<h4>ACCOUNT</h4>

<a href="complete-profile.html">
<i class="fa-solid fa-user"></i>
Update Profile
</a>

<a href="change-password.html">
<i class="fa-solid fa-key"></i>
Change Password
</a>

<a href="#" onclick="logout()">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</a>

</div>

</div>

</nav>

</header>

<!-- ================= MAIN LAYOUT ================= -->
<div class="admin-layout" style="background:linear-gradient(135deg,#8f25eb,#27bccf);">

<!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">

      <!-- TOGGLE -->
      <div class="sidebar-toggle" onclick="toggleSidebar()">
        <i class="fa-solid fa-chevron-left" id="toggleIcon"></i>
      </div>

      <h3>Management Controls Segment</h3>

      <!-- SEARCH -->
      <input type="text" id="menuSearch" class="menu-search" placeholder="Search Menu...">

      <!-- FACULTY -->
      <button class="side-btn" data-title="Faculty" onclick="loadSection('faculty')">
        <i class="fa-solid fa-chalkboard-user"></i>
        Faculty
      </button>

      <!-- BATCH -->
      <button class="side-btn" data-title="Batch" onclick="loadSection('batch')">
        <i class="fa-solid fa-layer-group"></i>
        Batch
      </button>

      <!-- STUDENT -->
      <button class="side-btn" data-title="Student" onclick="loadSection('student')">
        <i class="fa-solid fa-user-graduate"></i>
        Student
      </button>

      <!-- FEES -->
      <button class="side-btn" data-title="Fees" onclick="loadSection('fees')">
        <i class="fa-solid fa-money-bill"></i>
        Fees Management
      </button>

      <!-- MATERIALS -->
      <button class="side-btn" data-title="Materials" onclick="loadSection('materials')">
        <i class="fa-solid fa-file"></i>
        Notes / Videos
      </button>

      <!-- LIVE -->
      <button class="side-btn" data-title="Live Streaming" onclick="loadSection('live')">
        <i class="fa-solid fa-video"></i>
        Live Streaming
      </button>

      <!-- AI -->
      <button class="side-btn" data-title="AI Assist" onclick="window.location.href='ai.html'">
        <i class="fa-solid fa-robot"></i>
        AI Assist
      </button>

    </aside>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="work-area" style="background:linear-gradient(135deg,#042265,#a746e7);">

      <div id="dynamicContent">
        <!-- Dynamic Content -->
      </div>

    </main>

  </div>
